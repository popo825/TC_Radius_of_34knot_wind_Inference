name: Hourly R34 inference and Pages
run-name: R34 inference · ${{ github.event_name }} · run ${{ github.run_number }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "2"
      R34_MODEL_PATH: .models/model.pth
      R34_MODEL_URL: ${{ vars.R34_MODEL_URL || format('https://github.com/{0}/releases/download/model-v1/TCR34_reference_DNN_test1_25MAE.pth', github.repository) }}
      R34_MODEL_SHA256: ${{ vars.R34_MODEL_SHA256 || '3bca4f0a6007678298203692c29c17181753632e7fec2132105b1a7939a5a410' }}

    steps:
      - name: Record workflow trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          printf 'Event: %s\nSchedule: %s\nRef: %s\n' "$TRIGGER_EVENT" "$TRIGGER_SCHEDULE" "$TRIGGER_REF" >> "$GITHUB_STEP_SUMMARY"
          date -u '+Started: %Y-%m-%d %H:%M:%S UTC' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Cache verified model
        uses: actions/cache@v4
        with:
          path: .models
          key: r34-model-${{ env.R34_MODEL_SHA256 }}

      - name: Download and verify model
        run: python -m backend.fetch_model

      - name: Check pipeline and frontend
        run: |
          python -m unittest discover -s tests -v
          node --check frontend/app.js
          node --test tests/frontend.test.cjs

      - name: Build hourly observations and predictions
        env:
          R34_PREVIOUS_SITE_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python -m backend.batch --output dist --previous-site "$R34_PREVIOUS_SITE_URL"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
